name: Build Windows .exe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build exe
        run: |
          pyinstaller --version
          mkdir dist build
          pyinstaller MusicDL.spec --noconfirm
          dir dist

      - name: Show result
        run: |
          echo Build output:
          dir dist
          if exist dist\MusicDL.exe (echo SUCCESS: MusicDL.exe found) else (echo FAILED: MusicDL.exe NOT found)

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MusicDL-exe
          path: dist/MusicDL.exe
          retention-days: 14
