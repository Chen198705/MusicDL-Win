name: Build Windows .exe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller PySimpleGUI yt-dlp

      - name: Build exe
        run: pyinstaller MusicDL.spec --noconfirm

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MusicDL-exe
          path: dist/MusicDL.exe
          retention-days: 14
