name: Build Windows .exe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller yt-dlp PySimpleGUI
      - name: Build
        run: pyinstaller MusicDL.spec --onefile --distpath ./dist --workpath ./build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicDL-exe
          path: dist/MusicDL.exe
          retention-days: 14
