name: Build Windows .exe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller PySimpleGUI yt-dlp

      - name: Build exe
        run: pyinstaller MusicDL.spec --noconfirm

      - name: Upload to Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install githubrelease
          githubrelease create Chen198705/MusicDL-Win "v1.0.0" --name "MusicDL v1.0.0" --body "Windows executable" --replace || true
          githubrelease upload Chen198705/MusicDL-Win "v1.0.0" dist/MusicDL.exe || true
