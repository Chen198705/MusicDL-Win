name: Build Windows .exe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller PySimpleGUI yt-dlp

      - name: Build exe
        run: pyinstaller MusicDL.spec --noconfirm

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MusicDL-exe
          path: dist/MusicDL.exe
          retention-days: 14

      - name: Output base64
        if: success()
        run: |
          echo "EXE_SIZE=$(wc -c < dist/MusicDL.exe)"
          certutil -f -encodehex dist/MusicDL.exe %TEMP%\musicdl.b64 2NUL
          powershell -Command "[Convert]::ToBase64String([IO.File]::ReadAllBytes('dist\MusicDL.exe'))" | Out-File -FilePath %TEMP%\musicdl_b64.txt -Encoding ASCII
          type %TEMP%\musicdl_b64.txt
