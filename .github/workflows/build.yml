name: Build Windows .exe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller PySimpleGUI yt-dlp

      - name: Build exe
        run: pyinstaller MusicDL.spec --noconfirm

      - name: Configure GitHub CLI
        run: |
          gh auth setup-git

      - name: Upload to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.0 --repo Chen198705/MusicDL-Win && echo "exists" || gh release create v1.0.0 --repo Chen198705/MusicDL-Win --title "MusicDL v1.0.0" --notes "Windows executable built via GitHub Actions"
          gh release upload v1.0.0 dist/MusicDL.exe --repo Chen198705/MusicDL-Win --clobber
